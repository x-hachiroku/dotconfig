    { key = "7", mods = "Alt", chars = "\u001b[55;5u" },
    { key = "8", mods = "Alt", chars = "\u001b[56;5u" },
    { key = "9", mods = "Alt", chars = "\u001b[57;5u" },

    { key = "Enter", mods = "Alt", chars = "\u001b\r\n" },

    { key = "A", mods = "Control", chars = "\u001ba" },
    { key = "B", mods = "Control", chars = "\u001bb" },
    { key = "C", mods = "Control", action = "Copy" },
    { key = "D", mods = "Control", chars = "\u001bd" },
    { key = "E", mods = "Control", chars = "\u001be" },
    { key = "F", mods = "Control", action = "SearchPrevious" },
