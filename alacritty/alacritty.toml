[general]
import = [
    "./hikari.toml",
]

[env]
TERM = "xterm-256color"

[terminal]
osc52 = "CopyPaste"

[window]
dimensions = { columns = 168, lines = 42 }
opacity = 0.8

[scrolling]
history = 100000

[font]
size=14

[font.normal]
family = "Maple Mono CN"

[font.bold]
family = "Maple Mono CN"

[keyboard]
bindings = [
    { key = "A", mods = "Alt", chars = "\u0001" },
    { key = "B", mods = "Alt", chars = "\u0002" },
    { key = "C", mods = "Alt", chars = "\u0003" },
    { key = "D", mods = "Alt", chars = "\u0004" },
    { key = "E", mods = "Alt", chars = "\u0005" },
    { key = "F", mods = "Alt", chars = "\u0006" },
    { key = "G", mods = "Alt", chars = "\u0007" },
    { key = "H", mods = "Alt", chars = "\u0008" },
    { key = "I", mods = "Alt", chars = "\u0009" },
    { key = "J", mods = "Alt", chars = "\u000a" },
    { key = "K", mods = "Alt", chars = "\u000b" },
    { key = "L", mods = "Alt", chars = "\u000c" },
    { key = "M", mods = "Alt", chars = "\u000d" },
    { key = "N", mods = "Alt", chars = "\u000e" },
    { key = "O", mods = "Alt", chars = "\u000f" },
    { key = "P", mods = "Alt", chars = "\u0010" },
    { key = "Q", mods = "Alt", chars = "\u0011" },
    { key = "R", mods = "Alt", chars = "\u0012" },
    { key = "S", mods = "Alt", chars = "\u0013" },
    { key = "T", mods = "Alt", chars = "\u0014" },
    { key = "U", mods = "Alt", chars = "\u0015" },
    { key = "V", mods = "Alt", chars = "\u0016" },
    { key = "W", mods = "Alt", chars = "\u0017" },
    { key = "X", mods = "Alt", chars = "\u0018" },
    { key = "Y", mods = "Alt", chars = "\u0019" },
    { key = "Z", mods = "Alt", chars = "\u001a" },

    { key = "1", mods = "Control", chars = "\u001b[49;5u" },
    { key = "2", mods = "Control", chars = "\u001b[50;5u" },
    { key = "3", mods = "Control", chars = "\u001b[51;5u" },
    { key = "4", mods = "Control", chars = "\u001b[52;5u" },
    { key = "5", mods = "Control", chars = "\u001b[53;5u" },
    { key = "6", mods = "Control", chars = "\u001b[54;5u" },
    { key = "7", mods = "Control", chars = "\u001b[55;5u" },
    { key = "8", mods = "Control", chars = "\u001b[56;5u" },
    { key = "9", mods = "Control", chars = "\u001b[57;5u" },

    { key = "C", mods = "Control", action = "Copy" },
    { key = "V", mods = "Control", action = "Paste" },
    { key = "F", mods = "Control", action = "SearchPrevious" },
    { key = "Q", mods = "Control", action = "Quit" },

    { key = "Enter", mods = "Alt", chars = "\n" },
]
